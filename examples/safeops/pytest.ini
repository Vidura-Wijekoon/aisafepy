# Makes examples/safeops its own pytest rootdir.
#
# Without this file pytest walks up to the repository's pyproject.toml and
# adopts the library's config, including `asyncio_mode = "auto"` (a
# pytest-asyncio option) under `--strict-config`. The demo has no async tests
# and installs plain pytest, so that key is unknown and pytest exits 4 with
# "Unknown config option: asyncio_mode" before collecting anything.
#
# `pythonpath = .` puts examples/safeops on sys.path so `import safeops` works
# whether the suite is run as `pytest` or `python -m pytest`.
[pytest]
minversion = 8.0
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --strict-config
